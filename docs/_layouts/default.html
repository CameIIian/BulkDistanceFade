<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">本文へ移動</a>
    <header class="site-header">
      <h1><img src="{{ '/img/logo.png' | relative_url }}" alt="lazyFade — 距離フェードを、かんたんに、みんな同じに。" width="1774" height="887"></h1>
    </header>
    <main id="content" class="content">{{ content }}</main>
    <footer class="site-footer">
      <a href="https://github.com/CameIIian/lazyFade">GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/CameIIian/lazyFade/blob/main/LICENSE">MIT License</a>
    </footer>
  </body>
</html>
